<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyTriage · Defect classifier demo</title>
    <style>
        :root {
            --ink: #0f1b2d;
            --muted: #5b6b80;
            --line: #d9e0e8;
            --bg: #f5f7fa;
            --card: #ffffff;
            --accent: #1f5fbf;
            --accent-soft: #e6eefb;
            --ok: #1d7a4a;
            --warn: #a15c00;
            --warn-soft: #fff4e5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
        }

        header {
            background: var(--ink);
            color: #fff;
            padding: 18px 24px;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: .02em;
        }

        header p {
            margin: 2px 0 0;
            color: #a9b7c9;
            font-size: 13px;
        }

        main {
            max-width: 760px;
            margin: 28px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font: 14px/1.4 ui-monospace, Menlo, monospace;
            resize: vertical;
            text-transform: uppercase;
        }

        textarea:focus {
            outline: 2px solid var(--accent-soft);
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .examples {
            color: var(--muted);
            font-size: 13px;
        }

        .examples a {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
            margin-right: 8px;
        }

        #result {
            margin-top: 18px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .top h2 {
            margin: 0;
            font-size: 22px;
        }

        .chapter {
            color: var(--muted);
            font-weight: 500;
        }

        .badge {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 99px;
            white-space: nowrap;
        }

        .badge.ok {
            background: #e3f4ea;
            color: var(--ok);
        }

        .badge.warn {
            background: var(--warn-soft);
            color: var(--warn);
        }

        .options {
            margin: 16px 0 6px;
        }

        .opt {
            display: grid;
            grid-template-columns: 210px 1fr 52px;
            gap: 10px;
            align-items: center;
            margin: 8px 0;
        }

        .bar {
            height: 10px;
            background: var(--accent-soft);
            border-radius: 99px;
            overflow: hidden;
        }

        .bar>span {
            display: block;
            height: 100%;
            background: var(--accent);
            border-radius: 99px;
        }

        .pct {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .note {
            color: var(--muted);
            font-size: 13px;
            margin: 10px 0 0;
        }

        .advisory {
            margin-top: 14px;
            padding: 10px 12px;
            background: var(--warn-soft);
            border-radius: 8px;
            font-size: 13px;
            color: #6b4300;
        }

        .error {
            color: #b3261e;
        }

        footer {
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            margin: 24px 0;
        }
    </style>
</head>

<body>
    <header>
        <h1>SkyTriage</h1>
        <p>Defect classifier demo · calibrated confidence · prediction sets</p>
    </header>
    <main>
        <div class="card">
            <label for="text">Defect write-up</label>
            <textarea id="text" placeholder="e.g. MLG ACTUATOR LEAKING HYD FLUID. REPLACED SEAL."></textarea>
            <div class="row">
                <button id="go">Classify</button>
                <span class="examples">Try:
                    <a data-ex="NLG WOULD NOT RETRACT AFTER TAKEOFF. REPLACED SELECTOR VALVE.">gear</a>
                    <a data-ex="CRACK FOUND IN FUSELAGE SKIN AT STA 540 LBL 12. INSTALLED DOUBLER PER SRM.">fuselage</a>
                    <a data-ex="LH LANDING LIGHT INOP. REPLACED LAMP. OPS CHECK GOOD.">light</a>
                    <a data-ex="FLUID LEAK NEAR WHEEL WELL.">vague</a>
                </span>
            </div>
            <div id="result"></div>
        </div>
        <footer>Model predictions are advisory. API docs at <a href="/docs">/docs</a>.</footer>
    </main>
    <script>
        const $ = (id) => document.getElementById(id);
        const pct = (p) => `${Math.round(p * 100)}%`;
        const escape = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function render(r) {
            const badge = r.confident
                ? '<span class="badge ok">Confident</span>'
                : '<span class="badge warn">Please verify</span>';
            const rows = r.prediction_set.map((o) => `
      <div class="opt">
        <div>${escape(o.name)} <span class="chapter">ATA ${escape(o.chapter)}</span></div>
        <div class="bar"><span style="width:${(o.probability * 100).toFixed(1)}%"></span></div>
        <div class="pct">${pct(o.probability)}</div>
      </div>`).join("");
            const setNote = r.prediction_set.length > 1
                ? `The model is unsure, so it lists ${r.prediction_set.length} possible systems.`
                : "One answer: the model is sure enough that no alternatives are needed.";
            $("result").innerHTML = `
      <div class="top">
        <h2>${escape(r.top.name)} <span class="chapter">ATA ${escape(r.top.chapter)}</span></h2>
        ${badge}
      </div>
      <div class="options">${rows}</div>
      <p class="note">${setNote} This list contains the right answer about
        ${pct(r.coverage_target)} of the time. Model ${escape(r.model_version)}.</p>
      <div class="advisory">${escape(r.advisory)}</div>`;
        }

        async function classify() {
            const text = $("text").value.trim();
            if (text.length < 3) { $("result").innerHTML = '<p class="error">Type at least a few words.</p>'; return; }
            $("go").disabled = true;
            $("result").innerHTML = '<p class="note">Classifying…</p>';
            try {
                const res = await fetch("/v1/classify", {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
                });
                const body = await res.json();
                if (!res.ok) {
                    const msg = typeof body.detail === "string" ? body.detail : "Invalid input.";
                    $("result").innerHTML = `<p class="error">${escape(msg)}</p>`;
                } else {
                    render(body);
                }
            } catch (e) {
                $("result").innerHTML = '<p class="error">Could not reach the API. Is uvicorn running?</p>';
            } finally {
                $("go").disabled = false;
            }
        }

        $("go").addEventListener("click", classify);
        $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) classify(); });
        document.querySelectorAll("[data-ex]").forEach((a) =>
            a.addEventListener("click", () => { $("text").value = a.dataset.ex; classify(); }));
    </script>
</body>

</html>
