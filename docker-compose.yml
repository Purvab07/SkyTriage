services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: skytriage
      POSTGRES_PASSWORD: skytriage
      POSTGRES_DB: skytriage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # api, worker, prometheus and grafana get added in later phases

volumes:
  pgdata:
