[project]
name = "skytriage"
version = "0.1.0"
description = "Safety and reliability assistant for small aviation operators"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.45",
    "mapie>=0.8",
    "hdbscan>=0.8",
    "ruptures>=1.1",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "mlflow>=2.14",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "llm*", "pipelines*", "ml*", "workers*", "eval*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
